<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640"><defs></defs><rect x="0" y="0" width="980" height="640" rx="18" fill="#F4F8F7"/><text x="490.0" y="56" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="1">THE TRAFFIC-LIGHT PAIN CHECK</text><rect x="60" y="100" width="860" height="156" rx="16" fill="#DCEEE4"/><circle cx="130" cy="178" r="42" fill="#43936C"/><text x="196" y="144" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#43936C" font-weight="bold" text-anchor="start">GREEN — Monitor at home</text><circle cx="206" cy="175" r="5" fill="#43936C"/><text x="224" y="182" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#22303F" font-weight="normal" text-anchor="start">Mild ache after unusual activity</text><circle cx="206" cy="207" r="5" fill="#43936C"/><text x="224" y="214" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#22303F" font-weight="normal" text-anchor="start">Improves within a few days</text><circle cx="206" cy="239" r="5" fill="#43936C"/><text x="224" y="246" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#22303F" font-weight="normal" text-anchor="start">No numbness, tingling or weakness</text><rect x="60" y="276" width="860" height="156" rx="16" fill="#FAF0D7"/><circle cx="130" cy="354" r="42" fill="#E9C46A"/><text x="196" y="320" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#E9C46A" font-weight="bold" text-anchor="start">YELLOW — Book an assessment</text><circle cx="206" cy="351" r="5" fill="#E9C46A"/><text x="224" y="358" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#22303F" font-weight="normal" text-anchor="start">Pain lasting more than 1–2 weeks</text><circle cx="206" cy="383" r="5" fill="#E9C46A"/><text x="224" y="390" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#22303F" font-weight="normal" text-anchor="start">Keeps coming back in the same spot</text><circle cx="206" cy="415" r="5" fill="#E9C46A"/><text x="224" y="422" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#22303F" font-weight="normal" text-anchor="start">Radiating tension, frequent headaches</text><rect x="60" y="452" width="860" height="156" rx="16" fill="#FADDD3"/><circle cx="130" cy="530" r="42" fill="#E76F51"/><text x="196" y="496" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#E76F51" font-weight="bold" text-anchor="start">RED — Seek care promptly</text><circle cx="206" cy="527" r="5" fill="#E76F51"/><text x="224" y="534" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#22303F" font-weight="normal" text-anchor="start">Numbness, tingling or weakness in limbs</text><circle cx="206" cy="559" r="5" fill="#E76F51"/><text x="224" y="566" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#22303F" font-weight="normal" text-anchor="start">Pain after a fall or accident</text><circle cx="206" cy="591" r="5" fill="#E76F51"/><text x="224" y="598" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#22303F" font-weight="normal" text-anchor="start">Night pain, fever, or bladder/bowel changes</text></svg>