ica, Arial, sans-serif" font-size="19" fill="#22303F" font-weight="normal" text-anchor="middle">...releases a tiny gas bubble — not bone</text><line x1="560" y1="162" x2="600" y2="162" stroke="#1F3A5F" stroke-width="6" stroke-linecap="round"/><line x1="600" y1="162" x2="587.8756443470179" y2="169.0" stroke="#1F3A5F" stroke-width="6" stroke-linecap="round"/><line x1="600" y1="162" x2="587.8756443470179" y2="155.0" stroke="#1F3A5F" stroke-width="6" stroke-linecap="round"/><text x="490.0" y="312" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A97A6" font-weight="normal" text-anchor="middle">Same thing as cracking your knuckles — research shows it does not cause arthritis.</text></svg>