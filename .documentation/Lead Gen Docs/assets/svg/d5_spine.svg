<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640"><defs></defs><rect x="0" y="0" width="980" height="640" rx="18" fill="#F4F8F7"/><text x="490.0" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="1">YOUR SPINE AT A GLANCE</text><rect x="413.1248769000249" y="112.0" width="34.0" height="16" rx="8" fill="#2A9D8F"/><rect x="415.9764323180567" y="130.26086956521738" width="35.130434782608695" height="16" rx="8" fill="#2A9D8F"/><rect x="418.5326066226857" y="148.52173913043478" width="36.26086956521739" height="16" rx="8" fill="#2A9D8F"/><rect x="420.7253135633958" y="166.7826086956522" width="37.391304347826086" height="16" rx="8" fill="#2A9D8F"/><rect x="422.4943951256648" y="185.04347826086956" width="38.52173913043478" height="16" rx="8" fill="#2A9D8F"/><rect x="423.78893374488854" y="203.30434782608694" width="39.65217391304348" height="16" rx="8" fill="#43936C"/><rect x="424.5683629603451" y="221.56521739130434" width="40.78260869565217" height="16" rx="8" fill="#43936C"/><rect x="424.8033522827391" y="239.82608695652175" width="41.91304347826087" height="16" rx="8" fill="#43936C"/><rect x="424.4764469739025" y="258.0869565217391" width="43.04347826086956" height="16" rx="8" fill="#43936C"/><rect x="423.58244878326974" y="276.3478260869565" width="44.173913043478265" height="16" rx="8" fill="#43936C"/><rect x="422.12852933620826" y="294.6086956521739" width="45.30434782608695" height="16" rx="8" fill="#43936C"/><rect x="420.1340737008854" y="312.8695652173913" width="46.434782608695656" height="16" rx="8" fill="#43936C"/><rect x="417.63025754591564" y="331.1304347826087" width="47.565217391304344" height="16" rx="8" fill="#43936C"/><rect x="414.6593671121594" y="349.39130434782606" width="48.69565217391305" height="16" rx="8" fill="#E9C46A"/><rect x="411.2738768319798" y="367.6521739130435" width="49.82608695652174" height="16" rx="8" fill="#E9C46A"/><rect x="407.535304715656" y="385.9130434782609" width="50.95652173913044" height="16" rx="8" fill="#E9C46A"/><rect x="403.5128704721613" y="404.17391304347825" width="52.086956521739125" height="16" rx="8" fill="#E9C46A"/><rect x="399.28198563443226" y="422.4347826086956" width="53.21739130434783" height="16" rx="8" fill="#E9C46A"/><rect x="394.92260862370483" y="440.69565217391306" width="54.34782608695652" height="16" rx="8" fill="#E9C46A"/><rect x="390.517500633546" y="458.95652173913044" width="55.47826086956522" height="16" rx="8" fill="#E9C46A"/><rect x="386.1504203776117" y="477.2173913043478" width="56.608695652173914" height="16" rx="8" fill="#E76F51"/><rect x="381.90429707871164" y="495.4782608695652" width="57.73913043478261" height="16" rx="8" fill="#E76F51"/><rect x="377.8594215513812" y="513.7391304347826" width="58.869565217391305" height="16" rx="8" fill="#E76F51"/><rect x="374.0916948354893" y="532.0" width="60.0" height="16" rx="8" fill="#E76F51"/><circle cx="436.1248769000249" cy="86" r="26" fill="#1F3A5F"/><line x1="520" y1="150" x2="550" y2="150" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round"/><circle cx="520" cy="150" r="6" fill="#2A9D8F"/><text x="562" y="144" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2A9D8F" font-weight="bold" text-anchor="start">CERVICAL (neck)</text><text x="562" y="172" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#22303F" font-weight="normal" text-anchor="start">7 vertebrae — supports the head; neck pain &amp; headaches</text><line x1="520" y1="270" x2="550" y2="270" stroke="#43936C" stroke-width="4" stroke-linecap="round"/><circle cx="520" cy="270" r="6" fill="#43936C"/><text x="562" y="264" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#43936C" font-weight="bold" text-anchor="start">THORACIC (mid-back)</text><text x="562" y="292" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#22303F" font-weight="normal" text-anchor="start">12 vertebrae — anchors the ribs; posture &amp; stiffness</text><line x1="520" y1="400" x2="550" y2="400" stroke="#E9C46A" stroke-width="4" stroke-linecap="round"/><circle cx="520" cy="400" r="6" fill="#E9C46A"/><text x="562" y="394" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#E9C46A" font-weight="bold" text-anchor="start">LUMBAR (low back)</text><text x="562" y="422" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#22303F" font-weight="normal" text-anchor="start">5 vertebrae — carries the load; most common pain area</text><line x1="520" y1="510" x2="550" y2="510" stroke="#E76F51" stroke-width="4" stroke-linecap="round"/><circle cx="520" cy="510" r="6" fill="#E76F51"/><text x="562" y="504" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#E76F51" font-weight="bold" text-anchor="start">SACRUM &amp; COCCYX</text><text x="562" y="532" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#22303F" font-weight="normal" text-anchor="start">Fused base — connects spine to pelvis</text><text x="120" y="280" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#22303F" font-weight="normal" text-anchor="start">Every nerve in your body</text><text x="120" y="306" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#22303F" font-weight="normal" text-anchor="start">exits through this column —</text><text x="120" y="332" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#22303F" font-weight="normal" text-anchor="start">that's why spinal health</text><text x="120" y="358" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#22303F" font-weight="normal" text-anchor="start">affects more than your back.</text></svg>