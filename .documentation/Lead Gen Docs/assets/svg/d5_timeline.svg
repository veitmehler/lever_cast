<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620"><defs></defs><rect x="0" y="0" width="980" height="620" rx="18" fill="#F4F8F7"/><text x="490.0" y="54" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="1">YOUR FIRST VISIT, STEP BY STEP</text><rect x="70" y="96" width="840" height="84" rx="14" fill="#FFFFFF" stroke="#E7ECF0" stroke-width="3"/><circle cx="122" cy="138" r="28" fill="#2A9D8F"/><text x="122" y="148" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><text x="170" y="134" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1F3A5F" font-weight="bold" text-anchor="start">WELCOME &amp; PAPERWORK</text><text x="170" y="162" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#22303F" font-weight="normal" text-anchor="start">Health history, current symptoms, goals — arrive 10–15 minutes early.</text><rect x="790" y="110" width="104" height="34" rx="17" fill="#D7EBE8"/><text x="842" y="133" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">5–15 min</text><line x1="122" y1="170" x2="122" y2="196" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-dasharray="2,7"/><rect x="70" y="196" width="840" height="84" rx="14" fill="#FFFFFF" stroke="#E7ECF0" stroke-width="3"/><circle cx="122" cy="238" r="28" fill="#2A9D8F"/><text x="122" y="248" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><text x="170" y="234" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1F3A5F" font-weight="bold" text-anchor="start">CONSULTATION</text><text x="170" y="262" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#22303F" font-weight="normal" text-anchor="start">You talk, the chiropractor listens: what hurts, when it started, what makes it better or worse.</text><rect x="790" y="210" width="104" height="34" rx="17" fill="#D7EBE8"/><text x="842" y="233" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">10–15 min</text><line x1="122" y1="270" x2="122" y2="296" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-dasharray="2,7"/><rect x="70" y="296" width="840" height="84" rx="14" fill="#FFFFFF" stroke="#E7ECF0" stroke-width="3"/><circle cx="122" cy="338" r="28" fill="#2A9D8F"/><text x="122" y="348" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text><text x="170" y="334" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1F3A5F" font-weight="bold" text-anchor="start">EXAMINATION</text><text x="170" y="362" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#22303F" font-weight="normal" text-anchor="start">Posture, movement and orthopedic tests. Imaging is only ordered if genuinely needed.</text><rect x="790" y="310" width="104" height="34" rx="17" fill="#D7EBE8"/><text x="842" y="333" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">10–20 min</text><line x1="122" y1="370" x2="122" y2="396" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-dasharray="2,7"/><rect x="70" y="396" width="840" height="84" rx="14" fill="#FFFFFF" stroke="#E7ECF0" stroke-width="3"/><circle cx="122" cy="438" r="28" fill="#2A9D8F"/><text x="122" y="448" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text><text x="170" y="434" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1F3A5F" font-weight="bold" text-anchor="start">REPORT OF FINDINGS</text><text x="170" y="462" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#22303F" font-weight="normal" text-anchor="start">What was found, in plain language — plus a recommended plan and the chance to ask anything.</text><rect x="790" y="410" width="104" height="34" rx="17" fill="#D7EBE8"/><text x="842" y="433" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">5–10 min</text><line x1="122" y1="470" x2="122" y2="496" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-dasharray="2,7"/><rect x="70" y="496" width="840" height="84" rx="14" fill="#FFFFFF" stroke="#E7ECF0" stroke-width="3"/><circle cx="122" cy="538" r="28" fill="#2A9D8F"/><text x="122" y="548" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">5</text><text x="170" y="534" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1F3A5F" font-weight="bold" text-anchor="start">FIRST TREATMENT (IF APPROPRIATE)</text><text x="170" y="562" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#22303F" font-weight="normal" text-anchor="start">Many patients receive gentle care on day one. Nothing happens without your consent.</text><rect x="790" y="510" width="104" height="34" rx="17" fill="#D7EBE8"/><text x="842" y="533" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">10–15 min</text></svg>