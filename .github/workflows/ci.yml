name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client must exist before typecheck (both apps import
      # @prisma/client). Both schemas are identical and generate to the
      # default location.
      - name: Generate Prisma client
        run: |
          pnpm --filter @socioply/api exec prisma generate
          pnpm --filter @socioply/web exec prisma generate

      # Build the shared package so both apps can typecheck against its .d.ts.
      - name: Build shared package
        run: pnpm --filter @socioply/shared build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test
