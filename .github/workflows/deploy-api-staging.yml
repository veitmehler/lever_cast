name: Deploy API (Staging)

# Staging mirror of deploy-api.yml. Builds a SEPARATE image tag (:staging, never
# :latest) and deploys to a SEPARATE droplet path (/opt/socioply-staging) using
# STAGING_* secrets, so it can never touch production.
#
# Use this to validate connectivity-sensitive changes (Phase 2: Postgres-scoped
# TLS, SSRF guard) against real infrastructure before merging to main.

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build & deploy to staging"
        required: false
        default: staging

concurrency:
  group: deploy-api-staging
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # On manual dispatch, build the ref the operator chose; otherwise the
          # pushed staging branch.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (staging tags only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          # NOTE: :staging / :staging-<sha> — never :latest, so production
          # (which pulls :latest) is unaffected.
          tags: |
            ghcr.io/${{ github.repository_owner }}/lever_cast-api:staging
            ghcr.io/${{ github.repository_owner }}/lever_cast-api:staging-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Verify staging deploy secrets are set
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          missing=0
          [ -z "$TS_OAUTH_CLIENT_ID" ] && { echo "::error::TS_OAUTH_CLIENT_ID is empty or unset"; missing=1; }
          [ -z "$TS_OAUTH_SECRET" ] && { echo "::error::TS_OAUTH_SECRET is empty or unset"; missing=1; }
          [ -z "$DEPLOY_KEY" ] && { echo "::error::STAGING_DEPLOY_SSH_KEY is empty or unset"; missing=1; }
          [ -z "$HEALTH_URL" ] && { echo "::error::STAGING_HEALTH_URL is empty or unset"; missing=1; }
          [ "$missing" = "1" ] && exit 1
          echo "Staging deploy secrets present."

      # B1: join the runner to the tailnet so it reaches the droplet over
      # Tailscale instead of the public IP. Once this path is proven, public
      # port 22 on the droplet is closed via ufw. Ephemeral, tagged CI node.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Reach the droplet by its Tailscale MagicDNS name, not the public IP.
          TS_HOST=socioply-api-staging-01
          ssh-keyscan -H "$TS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host staging-droplet"
            echo "  HostName $TS_HOST"
            echo "  User socioply"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config

      - name: Smoke-test SSH connection
        run: ssh staging-droplet 'echo "SSH OK from $(hostname) as $(whoami)"'

      - name: Deploy to staging droplet
        env:
          HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
        run: |
          ssh staging-droplet "HEALTH_URL='$HEALTH_URL' bash -s" << 'ENDSSH'
            set -euo pipefail

            echo "::group::1. Tag current :staging as :staging-previous (for rollback)"
            docker tag ghcr.io/veitmehler/lever_cast-api:staging \
                       ghcr.io/veitmehler/lever_cast-api:staging-previous 2>/dev/null \
              && echo "Tagged" || echo "No existing :staging to tag (first staging deploy?)"
            echo "::endgroup::"

            echo "::group::2. Pull new image"
            cd /opt/socioply-staging
            docker compose pull
            echo "::endgroup::"

            echo "::group::3. Run Prisma migrations (staging DB)"
            # H1: no NODE_TLS_REJECT_UNAUTHORIZED override. Prisma's engine does its
            # own TLS via sslmode in DIRECT_URL (sslmode=require = encrypted, not
            # CA-verified), so it connects without disabling Node's TLS globally.
            docker compose run --rm -T --no-deps \
              api \
              npx prisma migrate deploy \
              --schema=/app/packages/db/prisma/schema.prisma < /dev/null
            echo "::endgroup::"

            echo "::group::4. Restart containers"
            docker compose up -d --remove-orphans
            docker compose ps
            echo "::endgroup::"

            echo "::group::4b. Prune dangling images"
            docker image prune -f
            echo "::endgroup::"

            echo "::group::5. Health check"
            echo "Waiting 10s for staging API to come up..."
            sleep 10
            for i in 1 2 3 4 5; do
              if curl -sf "$HEALTH_URL"; then
                echo ""
                echo "Staging health check PASSED on attempt $i"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "Staging health check FAILED — rolling back to :staging-previous"
            DEPLOY_TAG=staging-previous docker compose up -d --remove-orphans
            exit 1
          ENDSSH
