name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: # allows manual trigger from GitHub Actions UI

# Prevent concurrent deploys — cancel any in-flight run when a newer push arrives
concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lever_cast-api:latest
            ghcr.io/${{ github.repository_owner }}/lever_cast-api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Verify deploy secrets are set
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          missing=0
          [ -z "$TS_OAUTH_CLIENT_ID" ] && { echo "::error::TS_OAUTH_CLIENT_ID is empty or unset"; missing=1; }
          [ -z "$TS_OAUTH_SECRET" ] && { echo "::error::TS_OAUTH_SECRET is empty or unset"; missing=1; }
          [ -z "$DEPLOY_KEY" ] && { echo "::error::DEPLOY_SSH_KEY is empty or unset"; missing=1; }
          [ "$missing" = "1" ] && exit 1
          echo "Deploy secrets present."

      # B1: join the runner to the tailnet so it reaches the droplet over
      # Tailscale instead of the public IP. Public port 22 on the droplet is
      # closed (ufw); SSH stays reachable over tailscale0. Ephemeral tag:ci node.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Reach the droplet by its Tailscale MagicDNS name, not the public IP.
          TS_HOST=socioply-api-01
          {
            echo "Host droplet"
            echo "  HostName $TS_HOST"
            echo "  User socioply"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ConnectTimeout 15"
          } >> ~/.ssh/config
          # known_hosts pre-population is best-effort only: StrictHostKeyChecking
          # accept-new records the key on first connect anyway. The runner just
          # joined the tailnet, so the route to the droplet can take a few seconds
          # to settle — retry, but NEVER fail the step on keyscan alone (the real
          # connectivity gate is the smoke test below).
          for i in 1 2 3 4 5 6; do
            if ssh-keyscan -T 10 -H "$TS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "ssh-keyscan succeeded on attempt $i"
              break
            fi
            echo "ssh-keyscan attempt $i failed; tailnet route not ready, retrying in 5s..."
            sleep 5
          done
          echo "Configure SSH complete (keyscan best-effort)."

      - name: Smoke-test SSH connection
        run: |
          # Retry to absorb the brief window while the freshly-joined tailnet
          # route to the droplet settles.
          for i in 1 2 3 4 5 6; do
            if ssh droplet 'echo "SSH OK from $(hostname) as $(whoami)"'; then
              exit 0
            fi
            echo "SSH attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "::error::Could not reach droplet over Tailscale after retries"
          exit 1

      # In-flight gate (multi-tenancy plan D4b): container recreation kills
      # running generation work. Wait up to 15 min for the worker to go idle;
      # fail loudly instead of silently killing a client's burst.
      - name: Wait for in-flight work to finish
        run: |
          for i in $(seq 1 30); do
            BUSY=$(ssh droplet 'cd /opt/socioply && docker compose ps --status running -q api 2>/dev/null | grep -q . && docker compose exec -T api node -e "
              const {prisma}=require(\"@omniply/shared\");
              (async()=>{
                const runs=await prisma.socialAutomationRun.count({where:{status:{in:[\"pending\",\"processing\",\"scheduling\"]}}});
                const jobs=await prisma.articleJob.count({where:{status:\"in_progress\"}});
                console.log(runs+jobs);process.exit(0);
              })().catch(()=>{console.log(0);process.exit(0)})" 2>/dev/null || echo 0' | tail -1)
            BUSY=${BUSY:-0}
            if [ "$BUSY" = "0" ]; then
              echo "No in-flight work — safe to deploy."
              exit 0
            fi
            echo "In-flight work detected ($BUSY active) — waiting 30s (attempt $i/30)..."
            sleep 30
          done
          echo "::error::In-flight generation still running after 15 min — deploy aborted to avoid killing it. Re-run when idle."
          exit 1

      - name: Deploy to droplet
        run: |
          ssh droplet 'bash -s' << 'ENDSSH'
            set -euo pipefail

            echo "::group::1. Tag current :latest as :previous (for rollback)"
            docker tag ghcr.io/veitmehler/lever_cast-api:latest \
                       ghcr.io/veitmehler/lever_cast-api:previous 2>/dev/null \
              && echo "Tagged" || echo "No existing :latest to tag (first deploy?)"
            echo "::endgroup::"

            echo "::group::2. Pull new image"
            cd /opt/socioply
            docker compose pull
            echo "::endgroup::"

            echo "::group::3. Run Prisma migrations"
            # H1: no NODE_TLS_REJECT_UNAUTHORIZED override — Prisma's engine handles
            # TLS via sslmode in DIRECT_URL. Validated on staging first.
            docker compose run --rm -T --no-deps \
              api \
              npx prisma migrate deploy \
              --schema=/app/packages/db/prisma/schema.prisma < /dev/null
            echo "::endgroup::"

            echo "::group::3b. Seed prompt templates"
            docker compose run --rm -T --no-deps \
              api \
              /app/node_modules/.bin/tsx /app/packages/db/prisma/seed.ts < /dev/null
            echo "::endgroup::"

            echo "::group::4. Restart all containers"
            docker compose up -d --remove-orphans
            docker compose ps
            echo "::endgroup::"

            echo "::group::4b. Prune dangling images to reclaim disk"
            docker image prune -f
            echo "::endgroup::"

            echo "::group::5. Health check"
            echo "Waiting 10s for API to come up..."
            sleep 10
            for i in 1 2 3 4 5; do
              if curl -sf https://api.socioply.com/health; then
                echo ""
                echo "Health check PASSED on attempt $i"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "Health check FAILED after 5 attempts — rolling back"
            DEPLOY_TAG=previous docker compose up -d --remove-orphans
            exit 1
          ENDSSH
