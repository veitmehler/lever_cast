name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'

# Prevent concurrent deploys — cancel any in-flight run when a newer push arrives
concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lever_cast-api:latest
            ghcr.io/${{ github.repository_owner }}/lever_cast-api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to droplet via Tailscale SSH
        run: |
          ssh -o StrictHostKeyChecking=no socioply@socioply-api-01 << 'ENDSSH'
            set -e

            # ── 1. Save the currently running image for rollback ──────────────────
            docker tag ghcr.io/veitmehler/lever_cast-api:latest \
                       ghcr.io/veitmehler/lever_cast-api:previous 2>/dev/null || true

            # ── 2. Pull the new image ─────────────────────────────────────────────
            cd /opt/socioply
            docker compose pull

            # ── 3. Run Prisma migrations (in a one-off container, before restart) ─
            docker compose run --rm --no-deps \
              -e NODE_TLS_REJECT_UNAUTHORIZED=0 \
              api \
              npx prisma migrate deploy \
              --schema=/app/packages/db/prisma/schema.prisma

            # ── 4. Restart all containers with the new image ──────────────────────
            docker compose up -d --remove-orphans

            # ── 5. Health check ───────────────────────────────────────────────────
            echo "Waiting for API to start..."
            sleep 10
            curl -sf https://api.socioply.com/health \
              && echo "Health check passed" \
              || { echo "Health check FAILED — rolling back"; \
                   DEPLOY_TAG=previous docker compose up -d --remove-orphans; \
                   exit 1; }
          ENDSSH
