name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: # allows manual trigger from GitHub Actions UI

# Prevent concurrent deploys — cancel any in-flight run when a newer push arrives
concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lever_cast-api:latest
            ghcr.io/${{ github.repository_owner }}/lever_cast-api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Verify deploy secrets are set
        env:
          DROPLET_IP: ${{ secrets.DROPLET_PUBLIC_IP }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DROPLET_IP" ]; then
            echo "::error::DROPLET_PUBLIC_IP secret is empty or unset"
            exit 1
          fi
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is empty or unset"
            exit 1
          fi
          echo "Droplet IP set (length: ${#DROPLET_IP}), deploy key set (length: ${#DEPLOY_KEY})"

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPLET_IP: ${{ secrets.DROPLET_PUBLIC_IP }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DROPLET_IP" >> ~/.ssh/known_hosts 2>/dev/null
          echo "Host droplet" >> ~/.ssh/config
          echo "  HostName $DROPLET_IP" >> ~/.ssh/config
          echo "  User socioply" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config
          echo "  IdentitiesOnly yes" >> ~/.ssh/config
          echo "  StrictHostKeyChecking accept-new" >> ~/.ssh/config

      - name: Smoke-test SSH connection
        run: ssh droplet 'echo "SSH OK from $(hostname) as $(whoami)"'

      - name: Deploy to droplet
        run: |
          ssh droplet 'bash -s' << 'ENDSSH'
            set -euo pipefail

            echo "::group::1. Tag current :latest as :previous (for rollback)"
            docker tag ghcr.io/veitmehler/lever_cast-api:latest \
                       ghcr.io/veitmehler/lever_cast-api:previous 2>/dev/null \
              && echo "Tagged" || echo "No existing :latest to tag (first deploy?)"
            echo "::endgroup::"

            echo "::group::2. Pull new image"
            cd /opt/socioply
            docker compose pull
            echo "::endgroup::"

            echo "::group::3. Run Prisma migrations"
            # H1: no NODE_TLS_REJECT_UNAUTHORIZED override — Prisma's engine handles
            # TLS via sslmode in DIRECT_URL. Validated on staging first.
            docker compose run --rm -T --no-deps \
              api \
              npx prisma migrate deploy \
              --schema=/app/packages/db/prisma/schema.prisma < /dev/null
            echo "::endgroup::"

            echo "::group::3b. Seed prompt templates"
            docker compose run --rm -T --no-deps \
              api \
              /app/node_modules/.bin/tsx /app/packages/db/prisma/seed.ts < /dev/null
            echo "::endgroup::"

            echo "::group::4. Restart all containers"
            docker compose up -d --remove-orphans
            docker compose ps
            echo "::endgroup::"

            echo "::group::4b. Prune dangling images to reclaim disk"
            docker image prune -f
            echo "::endgroup::"

            echo "::group::5. Health check"
            echo "Waiting 10s for API to come up..."
            sleep 10
            for i in 1 2 3 4 5; do
              if curl -sf https://api.socioply.com/health; then
                echo ""
                echo "Health check PASSED on attempt $i"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "Health check FAILED after 5 attempts — rolling back"
            DEPLOY_TAG=previous docker compose up -d --remove-orphans
            exit 1
          ENDSSH
