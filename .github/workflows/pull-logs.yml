name: Pull API Logs

on:
  workflow_dispatch:
    inputs:
      tail:
        description: "Number of log lines to tail"
        required: false
        default: "300"
      since:
        description: "Show logs since this time (e.g. 2026-06-09T20:00:00Z, or 24h)"
        required: false
        default: ""

jobs:
  pull-logs:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPLET_IP: ${{ secrets.DROPLET_PUBLIC_IP }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DROPLET_IP" >> ~/.ssh/known_hosts 2>/dev/null
          echo "Host droplet" >> ~/.ssh/config
          echo "  HostName $DROPLET_IP" >> ~/.ssh/config
          echo "  User socioply" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config
          echo "  IdentitiesOnly yes" >> ~/.ssh/config
          echo "  StrictHostKeyChecking accept-new" >> ~/.ssh/config

      - name: Pull docker-compose logs (api container)
        run: |
          SINCE="${{ github.event.inputs.since }}"
          TAIL="${{ github.event.inputs.tail }}"
          if [ -n "$SINCE" ]; then
            ssh droplet "cd /opt/socioply && docker compose logs --no-log-prefix --since='${SINCE}' api 2>&1"
          else
            ssh droplet "cd /opt/socioply && docker compose logs --no-log-prefix --tail=${TAIL} api 2>&1"
          fi
