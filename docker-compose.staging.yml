# Staging compose stack — TEMPLATE.
#
# Copy this to the staging droplet at /opt/socioply-staging/docker-compose.yml.
# It mirrors the production stack (api + worker + caddy) but pulls the :staging
# image tag and reads secrets from .env.staging, so it is fully isolated from
# production (/opt/socioply, :latest, .env.production).
#
# The image tag is parameterized so the deploy workflow's rollback step can run
#   DEPLOY_TAG=staging-previous docker compose up -d
# to revert to the prior image.

services:
  api:
    image: ghcr.io/veitmehler/lever_cast-api:${DEPLOY_TAG:-staging}
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3001"]
    env_file: .env.staging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s

  worker:
    image: ghcr.io/veitmehler/lever_cast-api:${DEPLOY_TAG:-staging}
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env.staging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data

volumes:
  caddy-data:
